name: staging

services:
  java-api:
    image: muirytest.jfrog.io/docker-local/system-health-dashboard:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: app-staging
    ports:
      - "5001:8080"
    environment:
      ENVIRONMENT: staging
      PORT: "8080"
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}
      KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    labels:
      app: system-health
      environment: staging
    networks:
      - default
      - sre-net
    depends_on:
      - kafka

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-staging
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    labels:
      app: kafka
      environment: staging

  agent:
    image: muirytest.jfrog.io/docker-local/system-agent:${IMAGE_TAG:?Set IMAGE_TAG}
    container_name: agent-staging
    environment:
      MACHINE_NAME: staging-machine
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    labels:
      app: agent
      environment: staging
    depends_on:
      - kafka

  dashboard:
    build: ./dashboard
    container_name: dashboard-staging
    ports:
      - "3001:80"
    labels:
      app: dashboard
      environment: staging
    depends_on:
      - java-api

networks:
  sre-net:
    external: true
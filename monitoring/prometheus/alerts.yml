groups:
  - name: system-health
    rules:
      - alert: ServiceDown
        expr: up{job="system-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.environment }} app is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for over 1 minute."

      - alert: HighErrorRate
        expr: |
          sum by (environment) (rate(http_requests_total{status=~"5.."}[2m]))
            / sum by (environment) (rate(http_requests_total[2m])) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate in {{ $labels.environment }}"
          description: "More than 5% of requests are returning 5xx (currently {{ $value | humanizePercentage }})."
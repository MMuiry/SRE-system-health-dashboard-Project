global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: system-health
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets: ["app-staging:8080"]
        labels:
          environment: staging
      - targets: ["app-production:8080"]
        labels:
          environment: production
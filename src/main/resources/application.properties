spring.application.name=health-dashboard
server.port=${PORT:8081}

app.version=${APP_VERSION:1.0.0}
app.environment=${ENVIRONMENT:${APP_ENV:unknown}}
app.fault-injection.enabled=${ENABLE_FAULT_INJECTION:false}

app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.topic=${KAFKA_TOPIC:system-health-events}
app.kafka.metrics-topic=${KAFKA_METRICS_TOPIC:system-metrics}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=health-dashboard
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.producer.properties.max.block.ms=3000
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:false}


logging.structured.format.console=logstash
logging.structured.json.rename.[@timestamp]=timestamp
logging.structured.json.add.environment=${app.environment}
logging.structured.json.exclude=@version,level_value,thread_name

management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=prometheus
management.endpoints.web.path-mapping.prometheus=metrics